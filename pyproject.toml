[project]
name = "cannister"
version = "0.1.0"
description = "Advanced AI-powered coding assistant with AST-based code merging and codebase indexing capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Thant Min Htet", email = "thantminhtet18@gmail.com"}
]
keywords = ["ai", "coding-assistant", "ast", "code-analysis", "google-adk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "astor>=0.8.1",
    "google-adk>=1.3.0",
    "litellm>=1.72.6.post1",
    "pip>=25.1.1",
]
